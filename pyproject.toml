[project]
name = "langgraph-email"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raees Zakir", email = "zakirraees91@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.1,<5",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "pydantic-settings>=2,<3",
    "pydantic[email]>=2,<3",
]

[project.scripts]
